name: Build and deploy docs
description: >-
    Build and deploy docs to Netlify.

inputs:
    netlify-auth-token:
        description: 'Netlify auth token'
        required: true
    netlify-site-id:
        description: 'Netlify site ID'
        required: true

runs:
    using: composite
    steps:
        - name: Setup pnpm
          uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 #v6.0.10

        - name: Setup Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
          with:
              node-version-file: '.node-version'
              cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile
          shell: bash

        - name: Build docs
          run: pnpm docs:build
          shell: bash

        - name: Deploy docs
          run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --filter @chronus-dev/utils-docs
          shell: bash
          env:
              NETLIFY_AUTH_TOKEN: ${{ inputs.netlify-auth-token }}
              NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
