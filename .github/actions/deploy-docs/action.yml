name: Build and deploy docs
description: >-
  Build and deploy docs to Netlify.

inputs:
  netlify-auth-token:
    description: 'Netlify auth token'
    required: true
  netlify-site-id:
    description: 'Netlify site ID'
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.node-version'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build docs
      run: pnpm docs:build
      shell: bash

    - name: Deploy docs
      run: pnpm --package=netlify-cli dlx netlify deploy --prod --no-build --filter @chronus-dev/utils-docs
      shell: bash
      env:
        NETLIFY_AUTH_TOKEN: ${{ inputs.netlify-auth-token }}
        NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
